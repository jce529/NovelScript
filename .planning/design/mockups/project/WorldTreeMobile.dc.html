<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세계수 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#fff}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{height:52px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;box-sizing:border-box;background:#fff;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:#27272a}
.wt{display:flex;border-bottom:1px solid #e4e4e7;flex:none}
.wtab{flex:1;height:44px;border:0;background:transparent;font-size:14px;font-weight:600;color:#71717a;border-bottom:2px solid transparent}
.wtab.on{color:#3730a3;border-bottom-color:#4f46e5}
.sg{height:36px;border-radius:999px;border:1px solid #d4d4d8;background:#fff;color:#27272a;font-size:13px;font-weight:600;padding:0 14px;white-space:nowrap}
.sg.on{background:#18181b;border-color:#18181b;color:#fff}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#e0e7ff;color:#3730a3;white-space:nowrap}
.chip.g{background:#f4f4f5;color:#3f3f46}
.chip.ok{background:#dcfce7;color:#166534}
.sub{margin:0;font-size:12px;color:#52525b;line-height:1.55}
.lbl{font-size:11px;font-weight:700;color:#71717a;margin-bottom:2px}
.fruit{position:absolute;border-radius:999px;border:2px solid rgba(255,255,255,0.9);padding:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.18)}
.fruit.sel{outline:3px solid #4f46e5;outline-offset:2px}
.fruit.ghost{border:2px dashed #a1a1aa;color:#a1a1aa;box-shadow:none;font-size:13px}
.chip.warn{background:#fef3c7;color:#854d0e}
.brk{position:absolute;transform:translateX(-50%)}
.seg2{position:absolute;border:0;padding:0;border-radius:999px;transform-origin:0 50%}
.era{position:absolute;bottom:8px;font-size:10px;color:#71717a;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.tick{position:absolute;bottom:26px;width:1px;height:8px;background:#d4d4d8}
.fact{border:1px solid #e4e4e7;border-radius:10px;padding:7px 10px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;--accent:{{accent}}">

  <header class="top">
    <a class="ib" href="WorkMobile.dc.html" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <div style="display:flex;flex-direction:column;min-width:0;flex-grow:1"><span style="font-size:11px;color:#71717a">김하늘 작가</span><span style="font-size:14px;font-weight:700">달빛 서고</span></div>
    <span class="chip g">독자 보기</span>
  </header>

  <nav class="wt" aria-label="작품 상세 탭"><button class="wtab" type="button">정보</button><button class="wtab" type="button">회차</button><button class="wtab on" type="button">세계관</button><button class="wtab" type="button">리뷰</button></nav>

  <div style="display:flex;gap:8px;padding:10px 12px;flex:none;align-items:center">
    <button class="sg" type="button">설정 문서</button><button class="sg on" type="button">세계수</button>
    <span style="flex-grow:1"></span>
    <button class="sg" type="button" onClick="{{toggleOpen}}" style="font-size:12px;padding:0 10px">{{openLabel}}</button>
  </div>

  <div style="flex:none;position:relative;height:{{areaH}}px;background:linear-gradient(180deg,#fcfcfd,#f5f7ff);border-top:1px solid #e4e4e7;border-bottom:1px solid #e4e4e7">
    <div style="position:absolute;left:0;right:0;top:0;bottom:0;overflow-x:auto;overflow-y:hidden">
      <div style="position:relative;width:640px;height:100%">
        <sc-for list="{{segs}}" as="s"><button class="seg2" type="button" aria-label="{{s.name}}" onClick="{{s.pick}}" style="left:{{s.x}}px;top:{{s.y}}px;width:{{s.w}}px;height:{{s.th}}px;transform:rotate({{s.ang}}deg);background:{{s.bg}};outline:{{s.ol}};border-top:{{s.bd}}"></button></sc-for>
        <sc-for list="{{fruits}}" as="f"><button class="{{f.cls}}" type="button" aria-label="{{f.title}}" onClick="{{f.pick}}" style="left:{{f.x}}px;top:{{f.y}}px;width:{{f.d}}px;height:{{f.d}}px;background:{{f.bg}}">{{f.n}}</button></sc-for>
        <sc-for list="{{breaks}}" as="b"><span class="brk chip warn" style="left:{{b.x}}px;top:{{b.y}}px;font-size:10px">{{b.label}}</span></sc-for>
        <sc-for list="{{ticks}}" as="t"><span class="tick" style="left:{{t.x}}px"></span><span class="era" style="left:{{t.x}}px">{{t.label}}</span></sc-for>
      </div>
    </div>
    <span style="position:absolute;right:8px;top:6px;font-size:10px;color:#a1a1aa;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:999px">좌우로 밀어 보기 →</span>
  </div>
  <p class="sub" style="padding:6px 12px;flex:none">굵기 = 본가지와의 근접도 · 열매 크기 = 인기 · 초록 = 확장 가지 · 산식은 임시안</p>

  <sc-if value="{{noteText}}" hint-placeholder-val="{{false}}">
    <div style="margin:0 12px;background:#fef3c7;color:#854d0e;border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.5;flex:none">{{noteText}}</div>
  </sc-if>

  <section aria-label="선택한 항목" style="flex-grow:1;min-height:0;overflow-y:auto;border-top:1px solid #e4e4e7;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,0.06);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl" style="margin:0">{{sel.kind}}</span><span class="chip {{sel.chipCls}}">{{sel.chip}}</span></div>
    <span style="font-size:17px;font-weight:700;line-height:1.35">{{sel.title}}</span>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{sel.facts}}" as="f"><div class="fact"><div class="lbl">{{f.k}}</div><div style="font-size:14px;font-weight:700">{{f.v}}</div></div></sc-for>
    </div>
    <sc-if value="{{sel.desc}}" hint-placeholder-val="{{false}}"><p class="sub">{{sel.desc}}</p></sc-if>
    <sc-if value="{{sel.isBranch}}" hint-placeholder-val="{{false}}">
      <p class="sub">분기 시점 스냅샷으로 고정돼요. 원작 설정이 바뀌어도 이 가지에는 반영되지 않아요. 분기 이전 설정은 본가지 진도, 이 가지만의 설정은 이 가지 진도만큼 열려요.</p>
    </sc-if>
    <sc-if value="{{sel.isFruit}}" hint-placeholder-val="{{true}}">
      <a href="WorkMobile.dc.html" style="display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;background:{{accent}};color:#fff;font-size:14px;font-weight:700">작품 보러 가기</a>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4f46e5","options":["#4f46e5","#0f766e","#be185d","#b45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const priv = st.priv === true;
    const sel = st.sel || 'f2';
    const TY = 250, SX = 0.58, SY = 0.78, OY = 6;
    const trunk = { id: 'trunk', x1: 60, y1: TY, x2: 1060, y2: TY, th: 12, name: '본가지(달빛 서고 세계관)' };
    const branches = [
      { id: 'bA', x1: 360, y1: TY, x2: 760, y2: 100, th: 9, name: '가지 A · 소연이 서고를 떠났다면', near: '가까움', size: '중간', docs: 2, pop: '높음' },
      { id: 'bA2', x1: 560, y1: 175, x2: 900, y2: 50, th: 4, name: '가지 A-2 · 떠난 뒤 10년', near: '조금 멈', size: '작음', docs: 5, pop: '낮음' },
      { id: 'bC', x1: 700, y1: TY, x2: 940, y2: 400, th: 7, name: '가지 C · 북쪽 항구 연대기', near: '가까움', size: '중간', docs: 4, pop: '중간', expand: true },
      { id: 'bB', x1: 220, y1: TY, x2: 540, y2: 420, th: 4, name: '가지 B · 열람증이 없었다면', near: '멈', size: '작음', docs: 6, pop: '낮음' }
    ];
    const defs = [trunk].concat(branches);
    const palette = { bC: '#15803d', trunk: '#92400e', bA: '#a16207', bA2: '#ca8a04', bB: '#b45309' };
    const fr = [
      { id: 'f1', br: 'trunk', x: 170, y: TY, up: -1, title: '서고의 문지기', era: '1기 · 서고 이전', pop: 35, tag: '프리퀄', color: '#16a34a', n: '프' },
      { id: 'f2', br: 'trunk', x: 380, y: TY, up: 1, title: '달빛 서고', era: '2기 · 서고 시대', pop: 92, tag: '원작', color: '#dc2626', n: '원작' },
      { id: 'f3', br: 'trunk', x: 380, y: TY, up: -1, title: '항구의 편지', era: '2기 · 원작과 동시 진행', pop: 70, tag: '외전 · 동시 진행', color: '#ea580c', n: '외' },
      { id: 'f4', br: 'trunk', x: 960, y: TY, up: 1, title: '달빛 서고 2부', era: '3기 · 서고 이후', pop: 60, tag: '속편', color: '#d97706', n: '2부' },
      { id: 'f5', br: 'bA', x: 740, y: 106, up: -1, title: '소연이 서고를 떠났다면', era: '3기 · If', pop: 80, tag: '셀프 가지', color: '#be185d', n: 'If' },
      { id: 'f6', br: 'bA2', x: 880, y: 56, up: -1, title: '떠난 뒤 10년', era: '4기 · If', pop: 30, tag: '셀프 가지', color: '#a21caf', n: '10' },
      { id: 'f8', br: 'bC', x: 920, y: 392, up: 1, title: '북쪽 항구 연대기', era: '3기 · 다른 지역', pop: 55, tag: '확장 가지', color: '#0d9488', n: '북' },
      { id: 'f7', br: 'bB', x: 520, y: 410, up: 1, title: '열람증이 없었다면', era: '2기 · If', pop: 20, tag: '셀프 가지', color: '#7c3aed', n: 'If' }
    ];
    const vis = () => true;
    const drawDefs = priv ? [Object.assign({}, trunk, { x2: 1000 }), { id: 'trunk', name: '부러진 가지', x1: 1000, y1: TY, x2: 1060, y2: TY, th: 3, dashed: true }].concat(branches) : defs;
    const segs = drawDefs.filter((s) => vis(s.id)).map((s) => {
      const X1 = s.x1 * SX, X2 = s.x2 * SX, Y1 = s.y1 * SY + OY, Y2 = s.y2 * SY + OY;
      const dx = X2 - X1, dy = Y2 - Y1, len = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
      return { name: s.name, x: X1, y: Y1 - s.th / 2, w: len, th: s.th, ang: ang.toFixed(2), bg: s.dashed ? 'transparent' : palette[s.id], bd: s.dashed ? '3px dashed #a8a29e' : 'none', ol: (sel === s.id && !s.dashed) ? '3px solid #4f46e5' : 'none', pick: () => this.setState({ sel: s.id }) };
    });
    const fruits = fr.filter((f) => vis(f.br)).map((f) => {
      const ghost = priv && f.id === 'f2';
      const d = ghost ? 34 : 20 + Math.round(f.pop * 0.3);
      return { title: ghost ? '비공개된 작품 자리' : f.title, n: ghost ? '?' : f.n, d: d, x: f.x * SX - d / 2, y: f.y * SY + OY + f.up * (d / 2 + 9) - d / 2, bg: ghost ? '#fafafa' : f.color, cls: 'fruit' + (sel === f.id ? ' sel' : '') + (ghost ? ' ghost' : ''), pick: () => this.setState({ sel: f.id }) };
    });
    const ticks = [{ x: 80, label: '1기' }, { x: 200, label: '2기' }, { x: 350, label: '3기' }, { x: 470, label: '4기' }];
    const f = fr.find((x) => x.id === sel), b = defs.find((x) => x.id === sel);
    let info;
    if (f) info = { kind: '열매 · 작품', title: f.title, chip: f.tag, chipCls: f.br === 'trunk' ? '' : 'g', facts: [{ k: '세계관 내 시점', v: f.era }, { k: '인기(임시 지수)', v: String(f.pop) }, { k: '속한 가지', v: f.br === 'trunk' ? '본가지' : '잔가지' }, { k: '연재 상태', v: f.id === 'f4' ? '연재 중' : '완결' }], isBranch: false, isFruit: true };
    else info = { kind: sel === 'trunk' ? '본가지' : (b.expand ? '잔가지 · 확장(다른 지역)' : '잔가지 · If 스토리'), title: b.name, chip: sel === 'trunk' ? '원작' : (b.expand ? '확장 가지' : '스냅샷 고정'), chipCls: sel === 'trunk' ? 'ok' : 'g', facts: sel === 'trunk' ? [{ k: '열매(작품)', v: '4편' }, { k: '잔가지', v: '4개' }] : [{ k: '근접도', v: b.near }, { k: '변경한 설정', v: b.docs + '개' }, { k: '인기', v: b.pop }, { k: '굵기', v: b.size }], isBranch: sel !== 'trunk', isFruit: false };
    if (priv && sel === 'f2') info = { kind: '비공개된 작품 자리', title: '비공개된 가지', chip: '비공개', chipCls: 'g', desc: '원래 본작이 있었던 자리예요. 이어진 작품은 계속 볼 수 있어요.', facts: [], isBranch: false, isFruit: false };
    const breaks = priv ? [{ x: 1030 * SX, y: TY * SY + OY - 30, label: '부러진 가지' }, { x: 380 * SX, y: TY * SY + OY + 54, label: '비공개된 본작 자리' }] : [];
    return {
      accent: this.props.accent ?? '#4f46e5',
      segs: segs, fruits: fruits, ticks: ticks, sel: info, breaks: breaks,
      areaH: 340, noteText: priv ? '원작이 비공개 상태예요. 작품 정보는 숨겨지고 이어진 가지는 그대로 보여요. 다시 발행하면 가지가 이어져요.' : '',
      openLabel: priv ? '미리보기: 원작 비공개' : '미리보기: 원작 발행 중',
      toggleOpen: () => this.setState({ priv: !priv, sel: 'f2' })
    };
  }
}
</script>
</body>
</html>
