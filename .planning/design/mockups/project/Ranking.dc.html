<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>랭킹 목록 창</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f7f7f9}
a{color:inherit;text-decoration:none}
.hd{background:#fff}
.hdi{max-width:1152px;margin:0 auto;height:60px;padding:0 16px;box-sizing:border-box;display:flex;align-items:center;gap:14px}
.logo{font-size:17px;font-weight:800;color:#18181b;letter-spacing:-0.02em}
.tok{display:flex;align-items:center;gap:8px;border:1px solid #d4d4d8;border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600;color:#18181b;white-space:nowrap}
.plus{width:24px;height:24px;border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.ib{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#27272a;border:0;background:transparent;padding:0}
.av{width:30px;height:30px;border-radius:999px;background:#c7d2fe;color:#3730a3;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pt{border-top:1px solid #f1f1f3}
.pti,.sti{max-width:1152px;margin:0 auto;padding:0 8px;box-sizing:border-box;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.p1{font-size:15px;font-weight:600;color:#3f3f46;padding:12px 16px;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.p1.on{color:#3730a3;border-bottom-color:#4f46e5}
.st{background:#fafafb;border-top:1px solid #e4e4e7;border-bottom:1px solid #e4e4e7}
.s1{font-size:14px;color:#52525b;padding:12px;white-space:nowrap;flex-shrink:0}
.s1.on{color:#3730a3;font-weight:700}
.wrap{max-width:1152px;margin:0 auto;padding:28px 16px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.08em;color:#71717a;text-transform:uppercase}
.h2{margin:0;font-size:22px;font-weight:700;color:#18181b}
.sub{margin:0;font-size:13px;color:#52525b;line-height:1.5}
.gc{font-size:13px;color:#52525b;padding:7px 14px;border-radius:8px;white-space:nowrap;flex-shrink:0;background:#fff;border:1px solid #e4e4e7}
.gc.on{background:#18181b;color:#fff;font-weight:600;border-color:#18181b}
.tag{font-size:13px;color:#27272a;padding:7px 14px;border:1px solid #d4d4d8;border-radius:8px;white-space:nowrap;background:#fff}
.sel{font-size:13px;color:#27272a;padding:8px 12px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;white-space:nowrap}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cv{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden}
.num{position:absolute;left:0;top:0;min-width:28px;height:28px;background:rgba(0,0,0,0.6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px;box-sizing:border-box}
.trust{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#18181b;color:#fff}
.t{font-size:14px;font-weight:600;color:#18181b;line-height:1.35}
.au{font-size:12px;color:#71717a}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f4f4f5;color:#3f3f46;white-space:nowrap}
.btn{font-size:13px;font-weight:600;padding:9px 18px;border-radius:8px;border:1px solid #d4d4d8;background:#fff;color:#27272a}
</style>
</helmet>
<div style="--accent: {{accent}}; min-height:1500px">

  <header class="hd">
    <div class="hdi">
      <a class="logo" href="Home.dc.html">NovelScript</a>
      <span style="flex-grow:1"></span>
      <div class="tok"><span>1,500 토큰</span><span class="plus" style="background:{{accent}}">+</span></div>
      <button class="ib" type="button" aria-label="검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <span class="av">김</span>
    </div>
    <nav class="pt" style="background:#fff"><div class="pti"><a class="p1" href="Home.dc.html">무료연재</a><a class="p1" href="Home.dc.html">유료연재</a><a class="p1 on" href="Ranking.dc.html">랭킹</a><a class="p1" href="Home.dc.html">내서재</a></div></nav>
    <nav class="st"><div class="sti"><a class="s1 on" href="Ranking.dc.html">주간 랭킹</a><a class="s1" href="Ranking.dc.html">루키 쿼터존</a><a class="s1" href="Ranking.dc.html">명예의 전당</a><a class="s1" href="Ranking.dc.html">완결작</a></div></nav>
  </header>

  <main class="wrap">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="eyebrow">Weekly Ranking</span>
      <h1 class="h2">주간 랭킹</h1>
      <p class="sub">클릭이 아니라 끝까지 읽은 비율(완독률)과 다음 화로 이어진 비율(연독률)로 줄 세웠어요. 매주 월요일 갱신돼요.</p>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div style="display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0">
        <span class="tag">태그검색</span>
        <span class="gc on">전체</span><span class="gc">판타지</span><span class="gc">무협</span><span class="gc">현대</span><span class="gc">로맨스</span><span class="gc">미스터리</span><span class="gc">현대판타지</span>
      </div>
      <div style="display:flex;gap:8px">
        <span class="sel">완독·연독 종합 ▾</span><span class="sel">이번 주 ▾</span><span class="sel">연재 전체 ▾</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px">
      <sc-for list="{{items}}" as="w" hint-placeholder-count="15">
        <a class="card" href="Home.dc.html">
          <div class="cv" style="background:{{w.bg}}"><span class="num">{{w.n}}</span><span class="trust">연독률 {{w.read}}%</span></div>
          <span class="t">{{w.title}}</span>
          <span class="au">{{w.author}}</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge">{{w.genre}}</span><span class="badge">완독률 {{w.comp}}%</span><span class="badge">{{w.ep}}화</span></div>
        </a>
      </sc-for>
    </div>

    <div style="display:flex;justify-content:center"><span class="btn">더보기</span></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4f46e5","options":["#4f46e5","#0f766e","#be185d","#b45309"]},"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const bg = (h) => 'linear-gradient(160deg,hsl(' + h + ' 45% 82%),hsl(' + (h + 30) + ' 40% 60%))';
    const src = [
      ['달빛 서고', '작가 A', '판타지', 92, 81, 12, 262],
      ['잿빛 항구의 편지', '작가 B', '로맨스', 90, 78, 11, 20],
      ['열세 번째 계절', '작가 C', '미스터리', 88, 76, 13, 160],
      ['북쪽 별의 서기관', '작가 D', '판타지', 86, 74, 13, 210],
      ['여름의 끝에서 만나', '작가 E', '현대', 85, 72, 11, 340],
      ['소금 길의 약속', '작가 F', '로맨스', 84, 71, 9, 350],
      ['유리 탑의 수리공', '작가 G', '판타지', 83, 70, 12, 190],
      ['밤 열한 시의 편의점', '작가 H', '현대', 82, 69, 10, 120],
      ['붉은 지도의 주인', '작가 I', '미스터리', 81, 67, 14, 5],
      ['겨울 해바라기', '작가 J', '로맨스', 80, 66, 8, 300],
      ['검은 숲의 약사', '작가 K', '판타지', 79, 65, 11, 130],
      ['모래시계 도서관', '작가 L', '판타지', 78, 64, 12, 40],
      ['푸른 등대의 서기', '작가 M', '현대', 77, 63, 13, 210],
      ['은하 우체국', '작가 N', '판타지', 76, 62, 10, 250],
      ['오후 네 시의 탐정', '작가 O', '미스터리', 75, 61, 10, 190]
    ];
    return {
      accent: this.props.accent ?? '#4f46e5',
      items: src.map((a, i) => ({ n: i + 1, title: a[0], author: a[1], genre: a[2], read: a[3], comp: a[4], ep: a[5], bg: bg(a[6]) }))
    };
  }
}
</script>
</body>
</html>
